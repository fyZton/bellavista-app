<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Registro de Usuarios - Administrador</title>
    <style>
        body {
            background-image: url("{{ url_for('static', filename='imagenes/imagen1_v2.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .overlay {
            background-color: rgba(255, 255, 255, 0.98);
            min-height: 100vh;
            padding: 2rem;
        }

        .registration-container {
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 2rem;
        }

        .card-registro {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #0069d9, #005cbf);
            color: white;
            padding: 1.5rem;
            border-bottom: none;
        }

        .form-control-custom {
            border-radius: 8px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            border-color: #80bdff;
            box-shadow: none;
        }

        .cedula-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .cedula-group select {
            flex: 0 0 80px;
            border-radius: 8px;
            height: 45px;
        }

        .btn-back {
            background-color: #6c757d;
            color: white;
            border-radius: 8px;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #5a6268;
            transform: translateX(-3px);
            color: white;
        }

        .section-title {
            border-left: 4px solid #0069d9;
            padding-left: 1rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="registration-container">
            <!-- Botón de Volver -->
            <div class="mb-4">
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-back">
                    <i class="fas fa-arrow-left mr-2"></i>Volver al Panel
                </a>
            </div>

            <div class="row align-items-center">
                <!-- Texto Informativo -->
                <div class="col-lg-5 mb-4">
                    <div class="section-title">
                        <h2 class="text-primary font-weight-bold mb-3">Registro de Usuarios</h2>
                        <p class="lead">Complete todos los campos para registrar nuevos miembros en la plataforma.</p>
                    </div>
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle mr-2"></i>
                        Asegúrese de verificar la información antes de guardar.
                    </div>
                </div>

                <!-- Formulario -->
                <div class="col-lg-7">
                    <div class="card-registro">
                        <div class="card-header">
                            <h4 class="mb-0 text-center"><i class="fas fa-user-plus mr-2"></i>Nuevo Usuario</h4>
                        </div>
                        <div class="card-body p-4">
                            <form method="POST" action="/admin/registrar_usuario">
                                <!-- Grupo Cédula -->
                                <div class="mb-4">
                                    <label class="form-label font-weight-bold">Cédula de Identidad</label>
                                    <div class="cedula-group">
                                        <select class="form-control-custom" id="tipo_cedula" name="tipo_cedula" required>
                                            <option value="V">V</option>
                                            <option value="E">E</option>
                                            <option value="J">J</option>
                                        </select>
                                        <input type="text" class="form-control-custom" id="numero_cedula" 
                                               name="numero_cedula" required placeholder="Número de cédula">
                                    </div>
                                </div>

                                <!-- Campos del Formulario -->
                                <div class="row">
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label font-weight-bold">Nombre</label>
                                        <input type="text" class="form-control-custom" id="nombre" name="nombre" required>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label font-weight-bold">Apellido</label>
                                        <input type="text" class="form-control-custom" id="apellido" name="apellido" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label font-weight-bold">Nombre de Usuario</label>
                                    <input type="text" class="form-control-custom" id="username" name="username" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label font-weight-bold">Correo Electrónico</label>
                                    <input type="email" class="form-control-custom" id="correo" name="correo" required>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label font-weight-bold">Contraseña</label>
                                        <input type="password" class="form-control-custom" id="password" name="password" required>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label font-weight-bold">Rol de Usuario</label>
                                        <select class="form-control-custom" id="rol" name="rol" required>
                                            <option value="" disabled selected>Seleccionar rol</option>
                                            <option value="administrador">Administrador</option>
                                            <option value="jefe_familia">Jefe de Familia</option>
                                            <option value="usuario_normal">Usuario Normal</option>
                                        </select>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-block py-2">
                                    <i class="fas fa-save mr-2"></i>Registrar Usuario
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

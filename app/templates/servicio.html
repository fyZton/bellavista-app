<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio a Cancelar</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .main-container {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-top: 2rem;
        }

        .card-header {
            background: linear-gradient(135deg, #0069d9, #005cbf);
            color: white;
            padding: 1.25rem;
            border-bottom: none;
        }

        .form-control-custom {
            border-radius: 8px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        button {
            border-radius: 8px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left mr-2"></i>Volver
            </a>
            <h1 class="text-primary font-weight-bold mb-0">Servicio a Cancelar</h1>
        </div>

        <!-- Card Contenedora -->
        <div class="section-card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-money-check-alt mr-2"></i>Ingrese sus datos de pago</h5>
            </div>
            
            <div class="p-4">
                <form action="{{ url_for('servicio') }}" method="POST">
                    <div class="form-group">
                        <label for="jefe-familia">Jefe de Familia:</label>
                        <h3>{{ session.get('username') }}</h3>
                    </div>
                    <div class="form-group">
                        <label for="cedula">Cédula:</label>
                        <h3>{{ session.get('numero_cedula') }}</h3>
                    </div> 
                    <div class="form-group">
                        <label for="codigo-referencia">Código de Referencia:</label>
                        <input 
                            type="text" 
                            id="codigo-referencia" 
                            name="codigo-referencia" 
                            class="form-control-custom" 
                            required 
                            placeholder="Últimos seis dígitos"
                            pattern="\d{6}" 
                            title="Debe ingresar exactamente 6 dígitos numéricos."
                        >
                    </div>
                    <div class="form-group">
                        <label for="monto">Monto:</label>
                        <input type="text" id="monto" name="monto" class="form-control-custom" required placeholder="Monto en bolívares">
                    </div>
                    <div class="form-group">
                        <label for="banco">Seleccione el banco:</label>
                        <select id="banco" name="banco" class="form-control-custom" required>
                            <option value="">Seleccione un banco</option>
                            <option value="Banco de Venezuela (0102)">Banco de Venezuela (0102)</option>
                            <option value="Banco del Tesoro (0163)">Banco del Tesoro (0163)</option>
                            <option value="Banco Bicentenario (0175)">Banco Bicentenario (0175)</option>
                            <option value="BBVA Provincial (0108)">BBVA Provincial (0108)</option>
                            <option value="Banco Mercantil (0105)">Banco Mercantil (0105)</option>
                            <option value="Banesco (0134)">Banesco (0134)</option>
                            <option value="BOD (0116)">BOD (0116)</option>
                            <option value="BNC (0191)">BNC (0191)</option>
                            <option value="Banco Exterior (0115)">Banco Exterior (0115)</option>
                            <option value="Banco del Caribe (0104)">Banco del Caribe (0104)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="beneficio">Beneficios disponibles:</label>
                        <select name="beneficio" class="form-control-custom" required>
                            {% for beneficio in beneficios %}
                                <option value="{{ beneficio[0] }}">{{ beneficio[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-action">Registrar Pago</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

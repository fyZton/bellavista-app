<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELLA VISTA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0069d9;
            --secondary-color: #005cbf;
            --accent-color: #e7f3fe;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        #header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 1rem 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1000;
        }

        .logo {
            height: 50px;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        #navbar {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        #navbar a {
            color: white !important;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #navbar a:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        #navbar a.active {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* Hero Section */
        #hero {
            background: linear-gradient(rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95)),
                        url("{{ url_for('static', filename='imagenes/imagen1_v2.png') }}");
            background-size: cover;
            background-position: center;
            padding: 4rem 2rem;
            text-align: center;
            flex-grow: 1;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .user-greeting {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 1rem;
        }

        .community-name {
            font-size: 1.5rem;
            color: var(--secondary-color);
            margin-bottom: 2rem;
        }

        .quote {
            font-style: italic;
            color: #6c757d;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
            border-left: 3px solid var(--primary-color);
        }

        /* Feature Section */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        .feature-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .feature-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 1.5rem;
        }

        .feature-card h6 {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin: 0;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .user-greeting {
                font-size: 1.4rem;
            }
            
            #header {
                padding: 1rem;
            }
            
            #navbar {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <div class="d-flex justify-content-between align-items-center container">
            <a href="#">
                <img src="{{ url_for('static', filename='imagenes/BELLA_VISTA2.png') }}" class="logo" alt="Logo Bella Vista">
            </a>
            <nav>
                <ul id="navbar">
                    <li><a class="active" href="{{ url_for('dashboard') }}"><i class="fas fa-home"></i> Inicio</a></li>
                    <li><a href="{{ url_for('logout') }}" class="text-danger"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="hero">
        <h1 class="hero-title">Sistema de Gestión de Pagos</h1>
        <div class="user-greeting">
            <i class="fas fa-user-circle mr-2"></i>Bienvenido, {{ session.get('username') }}
        </div>
        <div class="community-name">
            <i class="fas fa-tree-city mr-2"></i>Comunidad Bella Vista
        </div>
        
        <div class="feature-grid">
            <a href="{{ url_for('servicio') }}" class="feature-card">
                
                <h6>Gestión de Servicios</h6>
            </a>
        </div>

        <blockquote class="quote">
            "La unión de la comunidad construye el futuro de todos"
        </blockquote>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>BELLA VISTA</title>
    <style>
        body {
            background-image: url("https://img.freepik.com/free-photo/cute-family-concept-arrangement-with-copy-space_23-2148485832.jpg?t=st=1738855397~exp=1738858997~hmac=d32c4b10852aa9084462974d6a757d8e12d570694008aec42a734091798a96a5&w=826");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .overlay {
            background-color: rgba(255, 255, 255, 0.95);
            min-height: 100vh;
            padding: 2rem;
        }

        .login-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .welcome-section {
            padding: 2rem;
            border-right: 2px solid #e9ecef;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn-primary {
            background-color: #0069d9;
            border: none;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #005cbf;
            transform: scale(1.02);
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
            transform: scale(1.02);
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
        }

        .form-control:focus {
            border-color: #80bdff;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="login-container">
            <div class="row align-items-center">
                <!-- Sección de Bienvenida -->
                <div class="col-lg-6 welcome-section">
                    <h1 class="display-4 text-primary mb-4 font-weight-bold">Bienvenido a Bella Vista</h1>
                    <p class="lead mb-4">Plataforma de gestión y control de beneficios</p>
                    <p class="text-muted">
                        Inicia sesión para acceder al sistema de administración de pagos 
                        y beneficios de la comunidad Bella Vista.
                    </p>
                </div>

                <!-- Formulario de Login -->
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-body p-5">
                            <h3 class="card-title text-center mb-4 font-weight-bold">Iniciar Sesión</h3>
                            
                            <form method="POST" action="/login">
                                <div class="mb-4">
                                    <label for="username" class="form-label">Usuario</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block py-2">Acceder al Sistema</button>
                            </form>

                            <div class="mt-4 text-center">
                                <p class="text-muted mb-2">¿No tienes una cuenta?</p>
                                <a href="/registro" class="btn btn-outline-secondary btn-block">Registrarse</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
